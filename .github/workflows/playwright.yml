name: Playwright Tests
on:
  push:
    branches: [ main, master, testdino/rerun-e2e ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so commit metadata resolves; depth=1 can miss the head commit.
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      run: npm install
    - name: Install Playwright browser (chromium)
      run: npx playwright install --with-deps chromium
    - name: Install tdpw CLI (local build from feat/rerun-native-pull)
      run: npm install ./testdino-playwright-2.3.1.tgz
    - name: Run Playwright tests (TestDino reporter → local backend via tunnel)
      # GITHUB_TOKEN authenticates the reporter's api.github.com metadata calls;
      # without it they are anonymous, rate-limited, and get dropped.
      # TESTDINO_TRIGGER_NOTE_URL is where the CLI fetches the rerun scope on
      # attempt >= 2. || true so intentional fixture failures do not fail the job.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TESTDINO_TRIGGER_NOTE_URL: ${{ vars.TESTDINO_TRIGGER_NOTE_URL }}
      run: npx tdpw test tests/rerun-fixture.spec.js -t "${{ secrets.TESTDINO_TOKEN }}" --server-url=${{ vars.TESTDINO_SERVER_URL }} --no-artifacts || true
