name: Playwright Tests
on:
  push:
    branches: [ main, master, testdino/rerun-e2e ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      # Local stack exposed via tunnels; both must be reachable from the runner.
      TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL }}
      TESTDINO_TRIGGER_NOTE_URL: ${{ vars.TESTDINO_TRIGGER_NOTE_URL }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run tests via TestDino
      # tdpw wraps Playwright: reports results and, on a GitHub-native rerun
      # (attempt >= 2), fetches the trigger note and scopes the run itself.
      run: npx tdpw test tests/rerun-fixture.spec.js
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
